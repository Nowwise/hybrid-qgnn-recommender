services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      QGNN_PROJECT_ROOT: /app
    volumes:
      - ./dataset:/app/dataset:ro
      - ./runs:/app/runs
    ports:
      - "127.0.0.1:8000:8000"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
